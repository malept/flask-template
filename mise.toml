[tools]
actionlint = "latest"
dprint = "latest"
"pipx:copier" = "latest"
ruff = "latest"
uv = "latest"

[tasks.e2e-test]
description = "Run copier on a temporary directory"
run = "./_tasks/e2e.sh"

[tasks."fix:ruff"]
description = "Fix fixable lints"
run = "ruff check --fix"

[tasks.fmt]
description = "Reformat / auto-lintfix source files"
depends = ["fmt:*", "fix:*"]

[tasks."fmt:dprint"]
description = "Reformat source files via dprint"
run = "dprint fmt"

[tasks."fmt:mise"]
description = "Reformat mise.toml with mise"
run = "mise fmt"

[tasks."fmt:ruff"]
description = "Reformat Python source files via ruff"
run = "ruff format"

[tasks."fmt:shfmt"]
tools.shfmt = "latest"
description = "Reformat shell files via shfmt"
sources = ["**/*.sh"]
outputs = { auto = true }
run = """
{%- set_global quoted_files = [] %}
{%- for file in task_source_files() %}
{%- set quoted = file | quote %}
{%- set_global quoted_files = quoted_files | concat(with=quoted) %}
{%- endfor %}
echo "Processing: {{ quoted_files }}"
{%- if quoted_files %}
shfmt --write {{ quoted_files | join(sep=" ") }}
{%- endif %}
"""

[tasks.lint]
description = "Check source files with linters"
depends = ["lint:*"]

[tasks."lint:dprint"]
description = "Check if source files need to be reformatted"
run = "dprint check"

[tasks."lint:editorconfig"]
tools.editorconfig-checker = "latest"
description = "Ensure that files conform to EditorConfig rules"
run = "ec -exclude LICENSE"

[tasks."lint:ruff"]
description = "Check source files with linter"
run = "ruff check"

[tasks."lint:ruff-format"]
description = "Check that Python source files are formatted by Ruff"
run = "ruff format --diff"

[tasks."lint:taplo"]
tools.taplo = "latest"
description = "Lints TOML files with Taplo"
run = "taplo lint"

[tasks."lint:taplo-format"]
tools.taplo = "latest"
description = "Checks if TOML files are formatted correctly"
run = "taplo format --check --diff"
